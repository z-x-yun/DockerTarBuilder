name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'alpine:latest,busybox:stable-glibc'

jobs:
  pull_and_package:
    runs-on: ubuntu-22.04

    steps:
    - name: 最大化可用空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android || true
        docker system prune --all --force --volumes || true
        df -h

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Save Docker Images with skopeo
      run: |
        images="${{ github.event.inputs.docker_images }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          echo "==== 处理 $image ===="
          image_name="${image//\//_}"
          image_name="${image_name//:/_}"
          skopeo copy --override-arch=arm64 \
            docker://$image \
            docker-archive:${image_name}-arm64.tar.gz
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: docker-images-${{ github.run_id }}
        name: Docker Images ${{ github.run_id }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Images to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: docker-images-${{ github.run_id }}
        files: ${{ github.workspace }}/*-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
