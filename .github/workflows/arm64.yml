name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请输入docker镜像名称，多个用英文逗号分隔'
        required: true
        default: 'alpine:latest,busybox:stable-glibc'

jobs:
  pull_and_package:
    runs-on: ubuntu-22.04

    steps:
    - name: 最大化可用空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android || true
        docker system prune --all --force --volumes || true
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pull and Save Docker Images
      run: |
        images="${{ github.event.inputs.docker_images }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          echo "==== 拉取并打包 $image ===="
          docker pull "${image}" --platform "linux/arm64"
          image_name="${image//\//_}"
          image_name="${image_name//:/_}"
          docker save "${image}" > "${image_name}-arm64.tar"
          # 压缩为 zip
          zip "${image_name}-arm64.zip" "${image_name}-arm64.tar"
          rm -f "${image_name}-arm64.tar"
          docker image rm "${image}" || true
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: docker-images-${{ github.run_id }}
        name: Docker Images ${{ github.run_id }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Images to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: docker-images-${{ github.run_id }}
        files: ${{ github.workspace }}/*-arm64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
