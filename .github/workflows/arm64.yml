name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: '请填写docker镜像名称 多个用英文逗号分开'
        required: true
        default: 'alpine:latest,busybox:stable-glibc'

jobs:
  pull_and_package:
    runs-on: ubuntu-20.04

    steps:
    - name: 最大化可用空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android || true
        docker system prune --all --force --volumes || true
        df -h

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Pull Docker Images and Package
      run: |
        images="${{ github.event.inputs.docker_images }}"
        IFS=',' read -r -a image_array <<< "$images"
        for image in "${image_array[@]}"; do
          echo "==== 处理 $image ===="
          # 拉取同时立即 save+gz，管道写法不产生中间 tar
          docker pull "${image}" --platform "linux/arm64"
          image_name="${image//\//_}"
          image_name="${image_name//:/_}"
          docker save "${image}" | gzip -c > "${image_name}-arm64.tar.gz"
          # 立刻删除本地镜像，释放空间
          docker image rm "${image}" || true
        done

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: arm64-docker-images
        path: ${{ github.workspace }}/*-arm64.tar.gz
        retention-days: 1          # 1 天后自动删除，省空间

